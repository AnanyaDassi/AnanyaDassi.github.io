<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ananya Dassi — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0c11;
    --bg-panel: #12151d;
    --bg-panel-2: #171b25;
    --line: #262b38;
    --line-soft: #1b1f2a;
    --accent: #ff8a3d;
    --accent-dim: #7a4322;
    --cyan: #4de8d4;
    --text: #edeff3;
    --text-muted: #8a93a3;
    --text-faint: #565f70;
    --radius: 4px;
    --disp: 'Space Grotesk', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:48px 48px;
    display:flex; flex-direction:column;
  }
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--accent); color:#0a0c11;}

  nav{
    position:sticky; top:0; z-index:10; backdrop-filter:blur(10px);
    background:rgba(10,12,17,.75); border-bottom:1px solid var(--line-soft);
  }
  .nav-wrap{max-width:820px; margin:0 auto; padding:0 24px; height:64px; display:flex; align-items:center; justify-content:space-between;}
  .nav-mark{font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:.06em; display:flex; align-items:center; gap:8px;}
  .nav-mark .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);}
  .back-link{
    font-family:var(--mono); font-size:12px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--text-muted); display:flex; align-items:center; gap:8px; transition:color .2s;
  }
  .back-link:hover{color:var(--accent);}

  main{flex:1; display:flex; flex-direction:column; max-width:820px; width:100%; margin:0 auto; padding:32px 24px 24px; min-height:0; overflow:hidden;}

  .chat-head{display:flex; align-items:center; gap:16px; margin-bottom:24px;}
  .bot-avatar{width:56px; height:56px; flex-shrink:0;}
  .chat-head h1{font-family:var(--disp); font-size:22px; font-weight:600;}
  .chat-head .status{font-family:var(--mono); font-size:11.5px; color:var(--cyan); display:flex; align-items:center; gap:6px; margin-top:4px;}
  .chat-head .status .dot{width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 6px var(--cyan);}

  .chat-window{
    flex:1; background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    display:flex; flex-direction:column; overflow:hidden; min-height:0;
  }
  .messages{flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px;}
  .messages::-webkit-scrollbar{width:8px;}
  .messages::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  .msg{max-width:78%; padding:12px 16px; border-radius:10px; font-size:14.5px; line-height:1.55;}
  .msg.bot{
    align-self:flex-start; background:var(--bg-panel-2); border:1px solid var(--line);
    border-bottom-left-radius:2px;
  }
  .msg.user{
    align-self:flex-end; background:var(--accent); color:#1a0e05; font-weight:500;
    border-bottom-right-radius:2px;
  }
  .msg-label{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:8px;}
  .msg.user .msg-label{color:rgba(26,14,5,.6);}

  .typing{align-self:flex-start; display:flex; gap:5px; padding:14px 16px; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; border-bottom-left-radius:2px;}
  .typing span{width:6px; height:6px; border-radius:50%; background:var(--text-faint); animation:bounce 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-4px); opacity:1;}}

  .composer{display:flex; gap:10px; padding:16px; border-top:1px solid var(--line-soft);}
  .composer input{
    flex:1; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--text);
    font-family:var(--body); font-size:14.5px; padding:12px 14px; outline:none; transition:border-color .2s;
  }
  .composer input:focus{border-color:var(--accent);}
  .composer input::placeholder{color:var(--text-faint);}
  .send-btn{
    font-family:var(--mono); font-size:13px; text-transform:uppercase; letter-spacing:.04em;
    background:var(--accent); color:#1a0e05; border:none; border-radius:8px; padding:0 22px;
    font-weight:600; cursor:pointer; transition:background .2s;
  }
  .send-btn:hover{background:#ffa25e;}
  .send-btn:disabled{opacity:.4; cursor:not-allowed;}

  .suggestions{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .chip{
    font-family:var(--mono); font-size:11.5px; color:var(--text-muted); background:var(--bg-panel);
    border:1px solid var(--line); padding:7px 12px; border-radius:20px; cursor:pointer; transition:border-color .2s, color .2s;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent);}

  footer{max-width:820px; margin:0 auto; width:100%; padding:0 24px 24px; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); text-align:center;}

  @media (max-width:600px){
    .msg{max-width:88%;}
  }
</style>
</head>
<body>

<nav>
  <div class="nav-wrap">
    <div class="nav-mark"><span class="dot"></span>A.DASSI</div>
    <a href="index.html" class="back-link">← Back to portfolio</a>
  </div>
</nav>

<main>
  <div class="chat-head">
    <svg class="bot-avatar" viewBox="0 0 360 460" xmlns="http://www.w3.org/2000/svg">
      <rect x="70" y="42" width="220" height="150" rx="40" fill="#151923" stroke="#2c3242" stroke-width="4"/>
      <rect x="100" y="76" width="160" height="94" rx="24" fill="#0d1017" stroke="#232a38" stroke-width="2"/>
      <circle cx="148" cy="122" r="26" fill="#0a0c11" stroke="#232a38" stroke-width="1"/>
      <circle cx="148" cy="122" r="11" fill="#4de8d4"/>
      <circle cx="212" cy="122" r="26" fill="#0a0c11" stroke="#232a38" stroke-width="1"/>
      <circle cx="212" cy="122" r="11" fill="#4de8d4"/>
      <rect x="150" y="150" width="60" height="7" rx="3.5" fill="#232a38"/>
      <rect x="162" y="150" width="16" height="7" rx="3.5" fill="#ff8a3d"/>
    </svg>
    <div>
      <h1>Ask my robot</h1>
      <div class="status"><span class="dot"></span>Online — usually replies instantly</div>
    </div>
  </div>

  <div class="chat-window">
    <div class="messages" id="messages">
      <div class="msg bot">
        <div class="msg-label">Bot</div>
        Hey, I'm Ananya's assistant. Ask me about her experience, projects, tech stack, or how to get in touch.
      </div>
    </div>
    <div class="composer">
      <input type="text" id="chatInput" placeholder="Type a message…" autocomplete="off">
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
  </div>

  <div class="suggestions">
    <div class="chip" data-q="What does Ananya work on?">What does she work on?</div>
    <div class="chip" data-q="What's her tech stack?">What's her tech stack?</div>
    <div class="chip" data-q="Tell me about her projects">Her projects</div>
    <div class="chip" data-q="How can I contact her?">How to reach her?</div>
  </div>
</main>

<footer></footer>

<script>
  const messages = document.getElementById('messages');
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const chips = document.querySelectorAll('.chip');

  const canned = [
    {k:['work','build','project','focus','do','role','job'], a:"Ananya is currently an Associate Solution Engineer at SAP, working on S/4HANA Private Cloud — diagnosing product issues and translating technical root causes into clear fixes for customers. Her projects range from ML-powered mobile apps and deep learning systems to IoT dashboards and full-stack web apps."},
    {k:['stack','tech','tool','language','use'], a:"She works across a pretty wide stack — Python, Java, JavaScript, PHP, Dart, C, HTML/CSS, JSP, and ABAP on the languages side. Frameworks and platforms include Flutter, Django, Firebase, Three.js, and Jupyter. For tooling: Git, Docker, and Google APIs."},
    {k:['contact','reach','email','hire','touch'], a:"Best way to reach her is email at dassiananya@gmail.com. You can also find her on GitHub (github.com/AnanyaDassi) and LinkedIn — links are in the contact section of the portfolio."},
    {k:['experience','background','history','work history','career'], a:"She graduated with a B.Tech in Computer Science from BMS Institute of Technology and Management in 2025. She joined SAP as an iXP intern in January 2025 and converted to Associate Solution Engineer in July 2025, where she's currently based in the S/4HANA Private Cloud team."},
    {k:['project','built','made','app','portfolio'], a:"Her projects include a Flutter-based Waste Classifier app with ML and AR, a deep learning system for histopathological cancer detection, an IoT air and water quality monitor with a Django dashboard, a Dijkstra-based airport route mapper with live weather data, and a PHP hospital appointment platform."}
  ];

  function botReply(text){
    const lower = text.toLowerCase();
    const match = canned.find(c => c.k.some(k => lower.includes(k)));
    return match ? match.a : "Good question — I don't have a canned answer for that yet, but feel free to reach out directly and Ananya can help.";
  }

  function addMessage(text, sender){
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.innerHTML = `<div class="msg-label">${sender === 'user' ? 'You' : 'Bot'}</div>${text}`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping(){
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function hideTyping(){
    const el = document.getElementById('typingIndicator');
    if(el) el.remove();
  }

  function sendMessage(text){
    if(!text.trim()) return;
    addMessage(text, 'user');
    input.value = '';
    showTyping();
    setTimeout(() => {
      hideTyping();
      addMessage(botReply(text), 'bot');
    }, 700 + Math.random() * 500);
  }

  sendBtn.addEventListener('click', () => sendMessage(input.value));
  input.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(input.value); });
  chips.forEach(chip => chip.addEventListener('click', () => sendMessage(chip.dataset.q)));
</script>

</body>
</html>
